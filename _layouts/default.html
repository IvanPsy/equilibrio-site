<!DOCTYPE html>
<html lang="it">
<head>
    {% include head.html %}
    {% if page.extra_css %}
    <style>{{ page.extra_css }}</style>
    {% endif %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>

{{ content }}

{% unless page.hide_footer %}
{% include footer.html %}
{% endunless %}

{% if page.whatsapp_float %}
{% include whatsapp-float.html %}
{% endif %}

{% include cookie-banner.html %}

{% if page.extra_js %}
<script>{{ page.extra_js }}</script>
{% endif %}

<!-- Conversion tracking: click WhatsApp -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('a[href*="wa.me"], .btn-whatsapp, .whatsapp-float').forEach(function(el) {
    el.addEventListener('click', function() {
      if (typeof gtag === 'function') {
        gtag('event', 'conversion', {
          'send_to': 'AW-1004214539/WHATSAPP_CLICK_LABEL',
          'value': 5.0,
          'currency': 'EUR'
        });
      }
    });
  });
});
</script>

</body>
</html>
