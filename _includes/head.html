<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{{ page.seo_title | default: page.title }} — {{ site.author }}</title>
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% endif %}

<!-- Open Graph: anteprima quando un link viene incollato in una chat privata,
     che su questo funnel e' il modo in cui il sito viene passato di mano. -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Equilibrio">
<meta property="og:locale" content="it_IT">
<meta property="og:title" content="{{ page.og_title | default: page.seo_title | default: page.title }}">
<meta property="og:description" content="{{ page.og_description | default: site.og_description_default }}">
<meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/ivan-ferrero.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">

{% include schema-person.html %}

<!-- Consent Mode v2 Advanced (consente modeling conversioni anche senza consenso) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'denied',
    'wait_for_update': 500
  });
  /* Con Advanced Consent Mode, Google riceve ping anonimi (senza cookie)
     anche quando il consenso è negato. Questo permette il conversion modeling:
     Google stima le conversioni totali basandosi sui dati di chi ha accettato.
     Nessun cookie viene scritto senza consenso — è GDPR-compliant.
     Ref: https://support.google.com/google-ads/answer/10000067 */
  /* Ripristino del consenso gia' espresso, il prima possibile e senza
     aspettare il banner che sta in fondo al body.
     ATTENZIONE: la chiave DEVE restare allineata a _includes/cookie-banner.html
     (STORAGE_KEY = 'eq_cookie_consent_v2', VERSION = '2.0.0'). Fino al
     19/08/2026 qui si leggeva 'cookie_consent', cioe' la chiave v1 che il
     banner migra e poi CANCELLA: questo ramo non poteva mai essere vero.
     Non faceva danno solo perche' il banner riapplica lo stato per conto suo,
     ma se un giorno quell'include si sposta o sparisce, il consenso torna
     negato per sempre e tutte le conversioni passano in cookieless, senza
     che nessun errore lo segnali. */
  try {
    var eqRaw = localStorage.getItem('eq_cookie_consent_v2');
    var eqSaved = eqRaw ? JSON.parse(eqRaw) : null;
    if (eqSaved && eqSaved.version !== '2.0.0') { eqSaved = null; }
    if (!eqSaved && localStorage.getItem('cookie_consent') === 'granted') {
      eqSaved = { analytics: true, marketing: true };
    }
    if (eqSaved) {
      gtag('consent', 'update', {
        'ad_storage':         eqSaved.marketing ? 'granted' : 'denied',
        'ad_user_data':       eqSaved.marketing ? 'granted' : 'denied',
        'ad_personalization': eqSaved.marketing ? 'granted' : 'denied',
        'analytics_storage':  eqSaved.analytics ? 'granted' : 'denied'
      });
    }
  } catch (e) {}
</script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.gtag_id }}"></script>
<script>
  gtag('js', new Date());
  gtag('config', '{{ site.gtag_id }}');
{%- if site.ga4_id and site.ga4_id != "" %}
  /* GA4: stessa libreria gtag, seconda destinazione. Rispetta il Consent Mode
     dichiarato sopra, quindi misura la quota di visitatori che accetta. */
  gtag('config', '{{ site.ga4_id }}');
{%- endif %}
  /* Advanced Consent Mode: passa gclid/dclid via URL per attribution senza cookie */
  gtag('set', 'url_passthrough', true);
  gtag('set', 'ads_data_redaction', true);

  /* ── Preserva gclid/utm tra navigazioni interne ──
     Quando ad_storage è denied, il cookie _gcl_aw non viene scritto.
     url_passthrough funziona solo per link cross-domain.
     Questo script salva i parametri di attribuzione in sessionStorage
     e li ripristina sui link interni, garantendo che la conversione
     venga attribuita al clic sull'annuncio anche senza cookie.
     GDPR-safe: sessionStorage è effimero (muore con la tab). */
  (function() {
    var params = ['gclid', 'dclid', 'gclsrc', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
    var url = new URL(window.location.href);
    var stored = {};
    /* Salva parametri dalla URL corrente */
    params.forEach(function(p) {
      var v = url.searchParams.get(p);
      if (v) {
        sessionStorage.setItem('_eq_' + p, v);
        stored[p] = v;
      }
    });
    /* Decora link interni con i parametri salvati */
    document.addEventListener('DOMContentLoaded', function() {
      var host = window.location.hostname;
      document.querySelectorAll('a[href]').forEach(function(a) {
        try {
          var linkUrl = new URL(a.href, window.location.origin);
          /* Solo link interni, non WhatsApp/external */
          if (linkUrl.hostname !== host) return;
          if (linkUrl.href.indexOf('wa.me') !== -1) return;
          if (linkUrl.href.indexOf('google.com/forms') !== -1) return;
          var modified = false;
          params.forEach(function(p) {
            var v = stored[p] || sessionStorage.getItem('_eq_' + p);
            if (v && !linkUrl.searchParams.has(p)) {
              linkUrl.searchParams.set(p, v);
              modified = true;
            }
          });
          if (modified) a.href = linkUrl.toString();
        } catch(e) { /* ignora link malformati */ }
      });
    });
  })();
</script>
